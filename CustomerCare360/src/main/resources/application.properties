spring.application.name=CustomerCare360
server.port=8080
server.servlet.context-path=/customercare360/v1
spring.config.import=optional:file:.env[.properties]
# Database
spring.datasource.url=${JDBC_URI}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Show formatted SQL
spring.jpa.properties.hibernate.format_sql=true

# Show query parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.jackson.deserialisation.fail-on-unknown-properties=true
# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Spring Security Logs (optional)
logging.level.org.springframework.security=DEBUG

debug=true
